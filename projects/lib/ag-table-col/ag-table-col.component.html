<span *ngIf="!noSort" class="ag-table-col-sort" (click)="toggleSort()" [class.sort-none]="!isSorting" [class.sort-asc]="isSorting && isSortAsc" [class.sort-desc]="isSorting && !isSortAsc"></span>

<div class="w-auto" [class.text-truncate]="!noTruncate && !customFilter">
    <ng-content></ng-content>
</div>

<div *ngIf="canFiltering && parent?.filterCtrls">
    <ag-table-filter *ngFor="let field of fields"
        [frmControl]="parent?.filterCtrls?.[field]"
        [type]="filter"
        [placeholder]="placeholder"
        [dateFormat]="dateFormat"
        [optionAllLabel]="optionAllLabel"
        [options]="options"
        (onChange)="onFiltering()" 
        (onRender)="onFilterRender()"> 
    </ag-table-filter>
</div>
