<span *ngIf="objCaption && !loading" class="caption animated fadeIn" [class.p-b-7]="length <= 1 || pages.length === 0">
	{{ (objCaption.total ? 'TOTAL_CAPTION' : 'WITHOUT_TOTAL_CAPTION') | translate:dictionary:objCaption }}
</span>

<ul *ngIf="length > 1 && pages.length > 0">
	<li [class.disabled]="current <= 1" class="animated fadeIn">
		<button (click)="pageClick(current - 1)">
			<i class="arrow-prev"></i>
		</button>
	</li>
	<li *ngFor="let page of pages" class="animated fadeIn"
		[class.actived]="page === current" [class.disabled]="disabled" [class.interval]="page === '...'">
		<button (click)="pageClick(page)">
			<span>{{page}}</span>
		</button>
	</li>
	<li [class.disabled]="current >= length" class="animated fadeIn">
		<button (click)="pageClick(current + 1)">
			<i class="arrow-next"></i>
		</button>
	</li>
</ul>
