<button class="close" mat-dialog-close [style.margin]="'15px 15px 0 0'"></button>

<img [src]="item.avatar"/>
<h1 mat-dialog-title>
    {{ item.name }}
</h1>

<span>Name:</span> {{item.name}}<br/>
<span>Phone:</span> {{item.phone}}<br/>

<br>
<span>Country:</span> {{item.country}}<br/>
<span>Profession:</span> {{item.profession}}<br/>
